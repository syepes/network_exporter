# Network Exporter Configuration - Cilium / Kubernetes example
#
# In clusters using the Cilium CNI, probe packets that leave with a very low
# IP TTL (MTR starts at TTL=1, and low ICMP TTLs) are counted as "Invalid
# Packets" and dropped by the Cilium datapath before they reach the wire.
# Raising the initial TTL lets the probes traverse Cilium.
#
# Only ICMP ping and MTR emit low TTLs; plain TCP and HTTP probes use the OS
# stack default and are unaffected.
conf:
  refresh: 15m
  nameserver_timeout: 250ms # Optional: DNS resolution timeout (default: 250ms)

icmp:
  interval: 3s
  timeout: 1s
  count: 6
  payload_size: 56  # Optional: ICMP payload size in bytes (default: 56)
  ttl: 64           # Optional: fixed IP TTL for echo packets (default: 128, range: 1-255). Raised so Cilium does not drop the probe as an Invalid Packet.

mtr:
  interval: 3s
  timeout: 500ms
  max-hops: 30
  first-ttl: 5      # Optional: starting TTL of the traceroute, like traceroute --first-ttl (default: 1, range: 1-255, must be < max-hops). Skips the low-TTL hops that Cilium drops.
  count: 6
  payload_size: 56  # Optional: ICMP payload size in bytes (default: 56)
  protocol: icmp    # Optional: Protocol for traceroute - "icmp" or "tcp" (default: icmp)
  tcp_port: 80      # Optional: Default port for TCP traceroute (default: 80)

tcp:
  interval: 3s
  timeout: 1s

http_get:
  interval: 15m
  timeout: 5s

# Note on first-ttl: hops below the start TTL are intentionally not reported
# (this is the point of traceroute --first-ttl). Operators who still need the
# near-side hops but want to dodge Cilium drops should prefer bumping only the
# ICMP ttl and keeping first-ttl modest.
targets:
  # Basic ICMP Ping
  - name: google-dns1
    host: 8.8.8.8
    type: ICMP

  # MTR Traceroute (uses ICMP by default from the mtr config)
  - name: google-dns2
    host: 8.8.4.4
    type: MTR

  # Combined ICMP Ping + MTR Traceroute
  - name: cloudflare-dns
    host: 1.1.1.1
    type: ICMP+MTR
